    const value=await new Promise((resolve,reject)=>{const r=db.transaction('kv').objectStore('kv').get('progress');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
    if(name!==DB_NAME)db.close(); return value||null;
  }catch{return null}
}
async function readSaved(){
  const modern=await readFromDB(DB_NAME);
  if(modern)return modern;
  const legacy=await readFromDB(OLD_DB_NAME);
  if(legacy)return legacy;
  return safeParse(localStorage.getItem('as-final-progress')||localStorage.getItem('as6-progress')||localStorage.getItem('as4-progress'),{});
}
async function save(){
  state.lastStudy=new Date().toISOString();
  try{localStorage.setItem('as-final-progress',JSON.stringify(state))}catch{}
  try{const db=await openDB();if(db)await new Promise((resolve,reject)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(state,'progress');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch{}
}
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>save(),180);
}
function mergeState(saved){
  if(!saved||typeof saved!=='object')return;
  for(const k of Object.keys(state))if(saved[k]!==undefined)state[k]=saved[k];
  state.wrong=Array.isArray(state.wrong)?state.wrong:[];
  state.bookmarks=Array.isArray(state.bookmarks)?state.bookmarks:[];
  state.completed=Array.isArray(state.completed)?state.completed:[];
  state.tests=Array.isArray(state.tests)?state.tests:[];
  state.attempts=state.attempts&&typeof state.attempts==='object'?state.attempts:{};
  state.due=state.due&&typeof state.due==='object'?state.due:{};
}
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2400)}
function setPage(p){if(session&&p!=='quiz'&&p!=='exam'&&p!=='exam-result'&&!confirm('Opuścić trwającą sesję? Jej wynik nie zostanie zapisany jako egzamin.'))return;session=null;clearPersistedSession();clearInterval(timerHandle);page=p;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'auto'})}
function btn(text,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function cardLink(icon,title,desc,action){return `<button class="card feature-card" data-action="${action}"><span class="feature-icon">${icon}</span><h3>${title}</h3><p>${desc}</p></button>`}
function countDue(){const now=Date.now();return Object.entries(state.due).filter(([id,d])=>d&&d.next<=now).length}
function accuracy(){return state.answered?Math.round(state.correct/state.answered*100):0}
function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dailyProgress(){if(!state.daily||state.daily.day!==localDay())return 0;return state.daily.count||0}
function masteryPct(){return Q.length?Math.min(100,Math.round(Object.keys(state.attempts).filter(id=>state.attempts[id]?.mastery>=3).length/Q.length*100)):0}
function readiness(){const m=masteryPct(),acc=accuracy(),passed=state.tests.filter(t=>t.passed).length;if(m>=85&&acc>=90&&passed>=1)return {label:'Bardzo dobrze przygotowany',note:'Masz mocne opanowanie bazy i co najmniej jedno zaliczone podejście próbne.'};if(m>=70&&acc>=85)return {label:'Blisko gotowości',note:'Warto jeszcze utrwalić słabsze działy i zrobić pełną symulację.'};if(m>=45||acc>=75)return {label:'Dobry kierunek',note:'Regularne krótkie sesje szybko podniosą wynik.'};return {label:'Budujemy podstawy',note:'Zacznij od lekcji i krótkich zestawów po 10 pytań.'}}
function smartPool(){const now=Date.now(),due=Q.filter(q=>state.due[q.id]?.next<=now),wrong=Q.filter(q=>state.wrong.includes(q.id)),weak=Q.filter(q=>state.attempts[q.id]&&state.attempts[q.id].mastery<3),unseen=Q.filter(q=>!state.attempts[q.id]),merged=[],seen=new Set();[...shuffle(due),...shuffle(wrong),...shuffle(weak),...shuffle(unseen)].forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);merged.push(q)}});return (merged.length?merged:shuffle(Q)).slice(0,15)}
function smartQuiz(){quizStart(smartPool(),'practice','Inteligentna powtórka')}

)}</div><div class="card recommendation"><span class="feature-icon">🔴</span><h3>Moje błędy</h3><p>${state.wrong.length?`Masz ${state.wrong.length} pytań do odzyskania.`:'Na razie nie ma zapisanych błędów.'}</p>${btn(state.wrong.length?'Powtórz błędy':'Trening losowy',state.wrong.length?'wrong-quiz':'random10','btn')}</div><div class="card recommendation"><span class="feature-icon">⏰</span><h3>Powtórki na dziś</h3><p>${due?`${due} pytań czeka już na powtórzenie.`:'Brak zaległych powtórek — możesz uczyć się nowych rzeczy.'}</p>${btn(due?'Otwórz powtórki':'Poznaj nowe pytania',due?'due-quiz':'smart-quiz','btn')}</div></div><div class="section-head"><h2>Centrum aplikacji</h2></div><div class="grid">${cardLink('📚','Centrum teorii','Krótkie lekcje i najważniejsze zasady.','learn')}${cardLink('📝','Trening pytań','Wyszukiwarka, działy i zestawy.','practice')}${cardLink('↻','Powtórki','Błędy, zapisane i inteligentny plan.','review')}${cardLink('📈','Twoje postępy','Wyniki, działy i kopia zapasowa.','progress')}</div><div class="section-head"><h2>Aktualność</h2></div><div class="card"><span class="pill green">Regulamin PZSS · stan sprawdzony ${BUILD_DATE}</span><p class="small">Baza pytań w aplikacji jest materiałem treningowym. Nie udajemy, że jest oficjalną bazą PZSS. Przed egzaminem sprawdź aktualne dokumenty u źródła.</p><div class="actions">${btn('Oficjalne materiały PZSS ↗','official','btn ghost')}${btn('Rejestr źródeł','sources','btn ghost')}</div></div>`}

function practicePage(){return `<div class="eyebrow">Trening</div><h1>Testy i pytania</h1><p class="muted">Szukaj zagadnień, filtruj działy i ćwicz w swoim tempie.</p><div class="card"><div class="filters"><input id="searchQ" class="field" placeholder="Szukaj pytania lub słowa…" autocomplete="off"><select id="filterCat" class="field"><option value="all">Wszystkie działy</option>${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="row-actions">${btn('Losowe 10 pytań','random10','btn primary')}${btn('Losowe 20 pytań','random20','btn')}${btn('Wszystkie pytania','all-questions','btn ghost')}</div></div><div class="section-head"><h2 id="resultsTitle">Działy tematyczne</h2><span class="muted small">${Q.length} pozycji</span></div><div id="questionResults" class="list">${categoryRows()}</div>`}
function categoryRows(){const counts=Object.fromEntries(CATS.map(c=>[c,{total:0,mastered:0}]));for(const q of Q){const x=counts[q.cat];if(x){x.total++;if(state.attempts[q.id]?.mastery>=3)x.mastered++}}return CATS.map((c,i)=>{const x=counts[c];return `<div class="list-row"><div class="feature-icon">${['⚖️','🛡️','🏅','🔧','📘'][i]}</div><div class="grow"><h3>${c}</h3><p>${x.total} pytań treningowych · ${Math.round(x.mastered/Math.max(1,x.total)*100)}% opanowane</p></div>${btn('Ćwicz →','category:'+c,'btn')}</div>`}).join('')}
function reviewPage(){const due=Q.filter(q=>state.due[q.id]&&state.due[q.id].next<=Date.now()),wrong=Q.filter(q=>state.wrong.includes(q.id)),saved=Q.filter(q=>state.bookmarks.includes(q.id));return `<div class="eyebrow">Utrwalanie</div><h1>Powtórki</h1><p class="muted">Wracaj do pytań we właściwym momencie i zamieniaj błędy w trwałą wiedzę.</p><div class="grid">${cardLink('⏰','Powtórka na dziś',`${due.length} pytań gotowych do powtórzenia.`,'due-quiz')}${cardLink('🎯','Moje błędy',`${wrong.length} pytań do ponownej nauki.`,'wrong-quiz')}${cardLink('★','Zapisane pytania',`${saved.length} pytań w zakładkach.`,'saved-quiz')}${cardLink('⚡','Szybka powtórka','Losuj do 15 pytań z najsłabszych działów.','weak-quiz')}</div><div class="section-head"><h2>Jak działa plan powtórek?</h2></div><div class="card"><p class="small">Po odpowiedzi aplikacja ustala następny termin powtórki. Błędne odpowiedzi wracają szybciej; poprawne i powtarzalne odpowiedzi stopniowo wydłużają odstęp. To prosty algorytm wspomagający naukę, a nie medycznie ani naukowo certyfikowana prognoza pamięci.</p></div>`}
function progressPage(){const cats=CATS.map(c=>{let qs=Q.filter(q=>q.cat===c),mastered=qs.filter(q=>(state.attempts[q.id]?.mastery||0)>=3).length,seen=qs.filter(q=>state.attempts[q.id]);return `<div class="list-row"><div class="grow"><h3>${c}</h3><p>${seen.length}/${qs.length} dotkniętych · ${mastered} opanowanych</p><div class="progress" style="margin-top:9px"><span style="width:${Math.round(mastered/Math.max(1,qs.length)*100)}%"></span></div></div><b>${Math.round(mastered/Math.max(1,qs.length)*100)}%</b></div>`}).join('');return `<div class="eyebrow">Panel użytkownika</div><h1>Twoje postępy</h1><div class="stat-grid"><div class="stat"><strong>${state.answered}</strong><span>odpowiedzi</span></div><div class="stat"><strong>${state.correct}</strong><span>poprawne</span></div><div class="stat"><strong>${accuracy()}%</strong><span>skuteczność łącznie</span></div><div class="stat"><strong>${state.tests.length}</strong><span>egzaminy próbne</span></div></div><div class="section-head"><h2>Opanowanie działów</h2></div><div class="list">${cats}</div><div class="section-head"><h2>Historia egzaminów</h2></div><div class="card">${state.tests.length?state.tests.slice().reverse().slice(0,12).map(t=>`<div class="list-row"><div class="grow"><h3>${esc(t.date)}</h3><p>${t.score}/${t.total} poprawnych · ${t.criticalFail?'błąd krytyczny':t.passed?'wynik pozytywny':'wynik negatywny'}</p></div><span class="pill ${t.passed?'green':'red'}">${t.pct}%</span></div>`).join(''):'<div class="empty">Po ukończeniu egzaminu pojawi się tu historia wyników.</div>'}</div><div class="section-head"><h2>Kopia zapasowa</h2></div><div class="card"><p class="small muted">Eksportuj postępy przed zmianą telefonu lub czyszczeniem danych przeglądarki. Import zastępuje aktualny zapis — zachowaj kopię pliku.</p><div class="actions">${btn('↓ Eksportuj postępy','export','btn primary')}${btn('↑ Importuj kopię','import','btn')}${btn('Resetuj postępy','reset','btn danger')}</div><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="section-head"><h2>Źródła i wersja bazy</h2></div><div class="card"><p class="small">Aplikacja: Akademia Strzelectwa ${APP_VERSION}<br>Baza: ${Q.length} pozycji treningowych<br>Status pytań: autorskie / wymagające indywidualnej weryfikacji<br>Źródła regulaminowe sprawdzone: ${BUILD_DATE}</p>${btn('Otwórz rejestr źródeł','sources','btn ghost')}</div>`}

function lessonPage(id){const l=LESSONS.find(x=>x.id===id);if(!l)return learnPage();return `<div class="eyebrow">Lekcja · ${esc(l.category)}</div><div class="card"><div class="feature-icon">${l.icon}</div><h1>${esc(l.title)}</h1><div class="lesson-body">${esc(l.body)}</div><div class="callout"><b>Sprawdź wiedzę:</b> po lekturze rozwiąż kilka pytań z tego działu. Korzystaj z linków do aktualnych źródeł, gdy temat dotyczy prawa lub regulaminu.</div><div class="actions">${btn(state.completed.includes(l.id)?'✓ Ukończono — oznacz ponownie':'Oznacz lekcję jako ukończoną','complete:'+l.id,'btn primary')}${btn('Ćwicz ten dział','category:'+((CATS.includes(l.category))?l.category:(l.id==='start'?CATS[0]:CATS[0])),'btn')}${btn('← Wszystkie lekcje','learn','btn ghost')}</div></div>`}
function persistSession(){try{if(session)sessionStorage.setItem('as-final-active-session',JSON.stringify(session));else sessionStorage.removeItem('as-final-active-session')}catch{}}
function clearPersistedSession(){try{sessionStorage.removeItem('as-final-active-session')}catch{}}
function quizStart(pool,mode='practice',title='Trening pytań'){pool=pool.filter(q=>q&&Array.isArray(q.a)&&q.a.length>=2);if(!pool.length){notify('Brak pytań w tym zestawie.');return}session={pool:shuffle(pool),idx:0,mode,title,answers:[],started:Date.now(),remaining:EXAM_DURATION/1000,deadline:null,chosen:null,order:null};if(mode==='exam'){session.pool=makeExam();session.title='Egzamin próbny';session.remaining=EXAM_DURATION/1000;session.deadline=Date.now()+EXAM_DURATION;session.started=Date.now();session.answers=[]}page=mode==='exam'?'exam':'quiz';persistSession();render();if(mode==='exam')startTimer()}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function makeExam(){let groups=EXAM_CATS.map(c=>shuffle(Q.filter(q=>q.cat===c)).slice(0,2));if(groups.some(g=>g.length<2)){notify('Nie można ułożyć pełnego zestawu — sprawdź bazę.');return shuffle(Q).slice(0,10)}return groups.flat()}
function startTimer(){clearInterval(timerHandle);if(!session||session.mode!=='exam')return;session.deadline=session.deadline||Date.now()+session.remaining*1000;const tick=()=>{if(!session||session.mode!=='exam')return;session.remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const el=$('#timer');if(el)el.textContent=fmt(session.remaining);if(session.remaining<=0){clearInterval(timerHandle);finishExam(true)}};tick();timerHandle=setInterval(tick,250)}function fmt(n){n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function renderQuestion(){if(!session)return;const q=session.pool[session.idx];if(!q)return;session.chosen=null;const options=q.a.map((txt,i)=>({txt,correct:i===q.c,orig:i}));session.order=shuffle(options);const exam=session.mode==='exam';$('#view').innerHTML=`<div class="eyebrow">${esc(session.title)}</div><div class="card question-card"><div class="q-top"><span class="pill">${esc(q.cat)}</span><span class="muted small">Pytanie ${session.idx+1} z ${session.pool.length}</span>${exam?`<span class="exam-timer" id="timer">${fmt(session.remaining)}</span>`:''}</div><div class="progress"><span style="width:${((session.idx+1)/session.pool.length)*100}%"></span></div><h1 class="q-title">${esc(q.q)}</h1>${q.verification==='verified'?'<span class="pill green">Zweryfikowane źródło</span>':'<span class="pill amber">Pytanie treningowe</span>'}<div class="choices" style="margin-top:15px">${session.order.map((o,i)=>`<button class="choice" data-answer="${i}"><span class="letter">${'ABCD'[i]||i+1}</span><span>${esc(o.txt)}</span></button>`).join('')}</div><div id="feedback"></div><div class="q-footer"><div class="answer-tools">${btn(state.bookmarks.includes(q.id)?'★ Zapisane':'☆ Zapisz pytanie','bookmark:'+q.id,'btn ghost')}${exam?'':btn('Pomiń','skip','btn ghost')}</div><div id="nextSlot"></div></div><p class="tiny muted" style="margin-top:14px">Materiał treningowy — sprawdzaj aktualne źródła. Odpowiedzi nie zastępują oficjalnych materiałów egzaminacyjnych.</p></div>`;$('#view').focus({preventScroll:true})}
function answerQuestion(i){if(!session||session.chosen!==null)return;session.chosen=i;const q=session.pool[session.idx],chosen=session.order[i],ok=chosen.correct;session.answers.push({id:q.id,ok,selected:chosen.txt,correct:q.a[q.c],question:q.q,cat:q.cat,explanation:q.e,critical:session.mode==='exam'&&session.idx<4});document.querySelectorAll('[data-answer]').forEach((b,n)=>{b.disabled=true;if(session.order[n].correct)b.classList.add('correct');if(n===i&&!ok)b.classList.add('wrong')});const fb=$('#feedback');if(session.mode!=='exam'){updateLearning(q,ok);fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<h3>${ok?'✓ Dobra odpowiedź':'✕ To nie ta odpowiedź'}</h3>${ok?'':`<p><b>Prawidłowo:</b> ${esc(q.a[q.c])}</p>`}<p>${esc(q.e||'Przeczytaj ponownie materiał źródłowy dotyczący tego zagadnienia.')}</p><span class="pill amber">Pytanie treningowe · bez potwierdzonego statusu oficjalnego</span>`;save()}else{fb.className='feedback';fb.innerHTML=`<p>${ok?'Odpowiedź zapisana.':'Odpowiedź zapisana.'} ${session.idx<4?'<b>Obszar krytyczny: prawo / bezpieczeństwo.</b>':''}</p>`}$('#nextSlot').innerHTML=btn(session.idx===session.pool.length-1?(session.mode==='exam'?'Zakończ egzamin':'Zakończ sesję'):'Następne →','next','btn primary');if(session.mode!=='exam')saveSoon()}
function updateLearning(q,ok){state.answered++;if(ok)state.correct++;let a=state.attempts[q.id]||{seen:0,correct:0,mastery:0};a.seen++;a.correct+=ok?1:0;a.mastery=ok?Math.min(5,a.mastery+1):Math.max(0,a.mastery-1);a.last=Date.now();state.attempts[q.id]=a;if(ok){state.wrong=state.wrong.filter(id=>id!==q.id)}else if(!state.wrong.includes(q.id))state.wrong.push(q.id);let interval=ok?([1,2,4,7,14,30][Math.min(a.mastery,5)]||30):0.005;state.due[q.id]={interval,next:Date.now()+interval*86400000};const today=localDay();if(!state.daily||state.daily.day!==today)state.daily={day:today,count:0,goal:10};state.daily.count=(state.daily.count||0)+1;if(state.streak.day!==today){const yesterday=localDay(new Date(Date.now()-86400000));state.streak.count=state.streak.day===yesterday?(state.streak.count||0)+1:1;state.streak.day=today}}
function nextQuestion(){if(!session)return;if(session.idx<session.pool.length-1){session.idx++;persistSession();renderQuestion()}else if(session.mode==='exam')finishExam(false);else{const n=session.answers.length,ok=session.answers.filter(a=>a.ok).length;session=null;clearPersistedSession();page='quiz-done';render();$('#view').innerHTML=`<div class="card"><div class="eyebrow">Sesja zakończona</div><h1>Dobra robota!</h1><div class="stat-grid"><div class="stat"><strong>${n}</strong><span>pytań</span></div><div class="stat"><strong>${ok}</strong><span>poprawnych</span></div><div class="stat"><strong>${n?Math.round(ok/n*100):0}%</strong><span>wynik</span></div><div class="stat"><strong>${state.wrong.length}</strong><span>błędy do nauki</span></div></div><div class="actions" style="margin-top:20px">${btn('Powtórz błędy','wrong-quiz','btn primary')}${btn('Kolejny trening','practice','btn')}${btn('Wróć na start','start','btn ghost')}</div></div>`}}
function finishExam(timeout=false){clearInterval(timerHandle);if(!session)return;const answers=session.answers,score=answers.filter(a=>a.ok).length,criticalFail=answers.some(a=>a.critical&&!a.ok),passed=score>=9&&!criticalFail;const item={date:new Date().toLocaleString('pl-PL'),score,total:10,pct:Math.round(score/10*100),passed,criticalFail,timeout,answers:answers.map(a=>({id:a.id,ok:a.ok,question:a.question,correct:a.correct,selected:a.selected,cat:a.cat}))};state.tests.push(item);answers.forEach(a=>{if(a.ok)state.wrong=state.wrong.filter(id=>id!==a.id);else if(!state.wrong.includes(a.id))state.wrong.push(a.id);let q=Q.find(x=>x.id===a.id);if(q)updateLearning(q,a.ok)});save();session=null;clearPersistedSession();page='exam-result';render();$('#view').innerHTML=`<div class="card"><div class="eyebrow">Wynik egzaminu próbnego</div><h1>${passed?'Wynik pozytywny':'Wynik negatywny'}</h1><div class="score" style="font:800 58px ui-sans-serif,system-ui,sans-serif;color:${passed?'var(--green)':'var(--red)'}">${score}/10</div><p>${score} poprawnych odpowiedzi na 10.</p><div class="callout">${criticalFail?'Błąd w jednym z pierwszych czterech pytań z obszaru prawa lub bezpieczeństwa — w symulacji oznacza to niezaliczenie.':passed?'Spełnione kryteria symulacji: co najmniej 9/10 i brak błędu w pierwszych czterech pytaniach.':'W tej symulacji do wyniku pozytywnego potrzeba minimum 9/10 i braku błędu w pierwszych czterech pytaniach.'}</div><p class="small muted">To edukacyjna symulacja oparta na opisanej strukturze regulaminu PZSS, a nie oficjalny arkusz ani gwarancja wyniku na egzaminie. Sprawdź aktualny regulamin przed podejściem.</p><div class="section-head"><h2>Przegląd odpowiedzi</h2></div>${item.answers.map((a,i)=>`<div class="list-row"><div class="grow"><h3>${i+1}. ${a.ok?'✓':'✕'} ${esc(a.question)}</h3><p>${a.ok?'Poprawnie':'Poprawna odpowiedź: '+esc(a.correct)}</p></div><span class="pill ${a.ok?'green':'red'}">${a.ok?'OK':'BŁĄD'}</span></div>`).join('')}<div class="actions" style="margin-top:18px">${btn('Kolejny egzamin','exam-start','btn primary')}${btn('Naucz się błędów','wrong-quiz','btn')}${btn('Wyniki','progress','btn ghost')}</div></div>`}
function toggleBookmark(id){if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();notify(state.bookmarks.includes(id)?'Dodano do zapisanych':'Usunięto z zapisanych');if(session){const b=document.querySelector('[data-action=\"bookmark:'+id+'\"]');if(b)b.textContent=state.bookmarks.includes(id)?'★ Zapisane':'☆ Zapisz pytanie'}else render()}
function exportData(){const blob=new Blob([JSON.stringify({app:'Akademia Strzelectwa',version:80,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='akademia-strzelectwa-postepy.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Przygotowano kopię postępów')}
async function importData(file){try{const d=JSON.parse(await file.text()),v=d.progress||d;if(!v||typeof v!=='object'||!('attempts'in v||'answered'in v))throw Error('Nieprawidłowy plik');if(!confirm('Import zastąpi obecne postępy. Kontynuować?'))return;mergeState(v);await save();notify('Zaimportowano postępy');setPage('progress')}catch(e){notify('Nie udało się odczytać kopii postępów')}}
function render(){const el=$('#view');if(page==='start')el.innerHTML=home();else if(page==='learn')el.innerHTML=learnPage();else if(page==='practice')el.innerHTML=practicePage();else if(page==='review')el.innerHTML=reviewPage();else if(page==='progress')el.innerHTML=progressPage();else if(page==='sources')el.innerHTML=sourcesPage();else if(page.startsWith('lesson:'))el.innerHTML=lessonPage(page.slice(7));else if(page==='quiz'||page==='exam'){renderQuestion();return}else if(page==='exam-result')return;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function runAction(a){if(a==='start'||a==='learn'||a==='practice'||a==='review'||a==='progress'||a==='sources'){setPage(a);return}if(a==='official'){window.open(SOURCE_URL,'_blank','noopener');return}if(a==='daily-quiz'){quizStart(shuffle(Q).slice(0,10),'practice','Wyzwanie dnia');return}if(a==='smart-quiz'){smartQuiz();return}if(a==='update-now'){if(updateRegistration&&updateRegistration.waiting){updateRegistration.waiting.postMessage('SKIP_WAITING')}else location.reload();return}if(a.startsWith('lesson:')){setPage(a);return}if(a.startsWith('complete:')){const id=a.slice(9);if(!state.completed.includes(id))state.completed.push(id);save();notify('Lekcja oznaczona jako ukończona');render();return}if(a==='learn-quiz'){const c=$('#learnCat').value,n=$('#learnNum').value;let pool=Q.filter(q=>c==='Wszystkie działy'||q.cat===c);quizStart(n==='all'?pool:shuffle(pool).slice(0,Number(n)));return}if(a.startsWith('category:')){const c=a.slice(9);quizStart(Q.filter(q=>q.cat===c),'practice',c);return}if(a==='exam-start'){quizStart(Q,'exam','Egzamin próbny');return}if(a==='random10'||a==='random20'){quizStart(shuffle(Q).slice(0,Number(a.slice(6))));return}if(a==='all-questions'){quizStart(Q);return}if(a==='due-quiz'){quizStart(Q.filter(q=>state.due[q.id]&&state.due[q.id].next<=Date.now()),'practice','Powtórka na dziś');return}if(a==='wrong-quiz'){quizStart(Q.filter(q=>state.wrong.includes(q.id)),'practice','Moje błędy');return}if(a==='saved-quiz'){quizStart(Q.filter(q=>state.bookmarks.includes(q.id)),'practice','Zapisane pytania');return}if(a==='weak-quiz'){let pool=Q.filter(q=>state.attempts[q.id]&&state.attempts[q.id].mastery<3);quizStart(shuffle(pool.length?pool:Q).slice(0,15),'practice','Szybka powtórka');return}if(a==='next'){nextQuestion();return}if(a==='skip'){if(session&&session.idx<session.pool.length-1){session.idx++;renderQuestion()}else nextQuestion();return}if(a.startsWith('bookmark:')){toggleBookmark(a.slice(9));return}if(a==='export'){exportData();return}if(a==='import'){$('#importFile').click();return}if(a==='reset'){if(confirm('Usunąć wszystkie lokalne postępy, historię egzaminów i zapisane pytania?')){for(const k of Object.keys(state))delete state[k];Object.assign(state,{answered:0,correct:0,attempts:{},wrong:[],bookmarks:[],completed:[],tests:[],streak:{day:'',count:0},daily:{day:'',count:0,goal:10},lastStudy:'',theme:'dark',due:{}});save();render();notify('Postępy wyczyszczone')}return}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const answer=e.target.closest('[data-answer]');if(answer){answerQuestion(Number(answer.dataset.answer));return}const b=e.target.closest('[data-action]');if(b)runAction(b.dataset.action)});
let searchTimer=null;
function updateSearchResults(){
  const q=($('#searchQ')?.value||'').trim().toLowerCase(),cat=$('#filterCat')?.value||'all';
  const list=Q.filter(x=>(cat==='all'||x.cat===cat)&&(!q||(x._search||'').includes(q)));
  const title=$('#resultsTitle'),box=$('#questionResults');
  if(!title||!box)return;
  title.textContent=`Wyniki wyszukiwania (${list.length})`;
  box.innerHTML=list.length?list.slice(0,100).map(x=>`<div class="list-row"><div class="grow"><h3>${esc(x.q)}</h3><p>${esc(x.cat)} · pytanie treningowe</p></div>${btn('Ćwicz','single:'+x.id,'btn')}</div>`).join(''):'<div class="empty">Nie znaleziono pasujących pytań.</div>';
}
document.addEventListener('input',e=>{
  if(e.target.id!=='searchQ')return;
  clearTimeout(searchTimer); searchTimer=setTimeout(updateSearchResults,120);
});
document.addEventListener('change',e=>{
  if(e.target.id==='filterCat')updateSearchResults();
});
// One-question action is wired separately to keep search results lightweight.
const originalRunAction=runAction;runAction=function(a){if(a.startsWith('single:')){const q=Q.find(x=>x.id===a.slice(7));if(q)quizStart([q]);return}originalRunAction(a)};
document.addEventListener('keydown',e=>{if(!session||session.chosen!==null)return;if(page!=='quiz'&&page!=='exam')return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();answerQuestion(Number(e.key)-1)}else if(e.key==='Enter'&&$('#nextSlot [data-action=next]')){e.preventDefault();nextQuestion()}});
$('#themeBtn').addEventListener('click',()=>{document.body.classList.toggle('light');state.theme=document.body.classList.contains('light')?'light':'dark';saveSoon()});document.addEventListener('change',e=>{if(e.target.id==='importFile'){if(e.target.files[0])importData(e.target.files[0]);e.target.value=''}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});$('#installBtn').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true}else notify('Użyj menu przeglądarki: Dodaj do ekranu głównego')});
function updateConnection(){const n=$('#connectionNotice'),t=$('#connectionText');if(!n)return;const offline=!navigator.onLine;n.hidden=!offline;if(t)t.textContent=offline?'Tryb offline — aplikacja korzysta z zapisanych danych.':'Połączenie przywrócone — aplikacja działa online.';n.classList.toggle('online',!offline)}
window.addEventListener('online',()=>{updateConnection();notify('Połączenie przywrócone')});window.addEventListener('offline',()=>{updateConnection();notify('Tryb offline — postępy nadal zapisują się lokalnie')});
async function boot(){try{if(!window.AS_DATA||!Array.isArray(window.AS_DATA.questions)||!Array.isArray(window.AS_DATA.lessons))throw Error('Brak lokalnej bazy danych');const [saved]=await Promise.all([readSaved()]);Q=window.AS_DATA.questions.map(item=>({...item,_search:(item.q+' '+item.e+' '+item.cat+' '+item.a.join(' ')).toLowerCase()}));LESSONS=window.AS_DATA.lessons;mergeState(saved);if(state.theme==='light')document.body.classList.add('light');
      let restored=false;try{const raw=sessionStorage.getItem('as-final-active-session');if(raw){const candidate=JSON.parse(raw);if(candidate&&Array.isArray(candidate.pool)&&candidate.pool.length&&Number.isInteger(candidate.idx)&&candidate.idx>=0&&candidate.idx<candidate.pool.length&&(candidate.mode==='quiz'||candidate.mode==='exam')){session=candidate;session.chosen=null;session.order=null;page=candidate.mode==='exam'?'exam':'quiz';restored=true;if(candidate.mode==='exam'){session.deadline=session.deadline||Date.now()+Math.max(0,Number(candidate.remaining)||0)*1000;startTimer()}}}}catch{}
      updateConnection();render();if(restored)notify('Przywrócono ostatnią sesję');if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){let refreshing=false;let hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController){hadController=true;return}if(refreshing)return;refreshing=true;location.reload()});navigator.serviceWorker.register('sw.js').then(reg=>{updateRegistration=reg;const showUpdate=()=>{if(reg.waiting&&navigator.serviceWorker.controller)$('#updateNotice').hidden=false};showUpdate();reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){$('#updateNotice').hidden=false;notify('Nowa wersja Akademii jest gotowa')}})});window.addEventListener('focus',()=>reg.update().catch(()=>{}));setInterval(()=>reg.update().catch(()=>{}),60*60*1000)}).catch(()=>{})}}catch(e){$('#view').innerHTML='<div class="card"><h1>Nie udało się załadować bazy</h1><p>Baza aplikacji jest wbudowana lokalnie. Spróbuj odświeżyć stronę albo rozpakować paczkę ponownie.</p><p class="small muted">Wersja 7.0 nie wymaga lokalnego serwera — możesz otworzyć index.html bezpośrednio.</p></div>'}}
boot();
